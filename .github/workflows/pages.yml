# Baut die Seite und veröffentlicht dist/ auf GitHub Pages (https://even512.github.io/InkAndEmbers-web/).
# Einmalig im Repo: Settings > Pages > Source = "GitHub Actions". Es werden keine Secrets gebraucht.
# Die Kartenkunst (public/maps/) liegt im Repo; der Build braucht keinen Spielclient.
# Actions sind auf einen Commit-SHA festgelegt (Tag im Kommentar); bewusst und nicht über bewegliche Tags aktualisieren.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# nichts standardmäßig; der Deploy-Job fordert nur an, was er braucht
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Tests
        run: npm test
      - name: Bauen
        run: npm run build
      - name: Pages einrichten
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
